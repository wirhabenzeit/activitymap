name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check formatting of this change only
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check --base "$FORMAT_BASE"
      - name: Fetch main for the OpenAPI breaking-change comparison
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
      - name: Check for breaking OpenAPI changes vs main
        run: pnpm openapi:check-breaking -- --base=origin/main

  browser-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision the pinned Chromium and Linux libraries
        run: pnpm test:browser:install --with-deps
      - name: Run fixture-only composed browser regressions
        run: pnpm test:browser
      - name: Upload browser logs, traces, screenshots and result counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-${{ github.run_attempt }}
          path: output/quality/browser/
          if-no-files-found: warn
          retention-days: 7

  swift-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate and compile the Swift client
        run: bash scripts/verify-swift-client.sh

  # Builds the real app and runs six bounded test suites on an owned simulator. The
  # api-dtos:check step in `quality` only compares generated text, and
  # `swift-client` above compiles a separate OpenAPI-generated package, so
  # this job additionally catches runtime failures and requires nonzero tests.
  #
  # The minimum deployment target is iOS 26. The iOS 27 SDK is still needed
  # to compile optional, availability-guarded APIs such as cross-fade navigation.
  # Keep the Xcode 27 runner for that SDK.
  ios-app:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record the toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator
      - name: Verify old and new Swift clients decode stream metadata
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
          bash scripts/verify-stream-dtos.sh origin/main
      - name: Verify compact summary codecs and encoded cache round trips
        run: bash scripts/verify-compact-stream-codec.sh
      - name: Run bounded iOS runtime regressions on an owned simulator
        run: node scripts/quality/native-harness.mjs
      - name: Upload native result bundle and test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-runtime-${{ github.run_attempt }}
          path: output/quality/ios/
          if-no-files-found: warn
          retention-days: 7

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: activitymap_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d activitymap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/activitymap_test
      MIGRATION_EXPECTED_DATABASE: activitymap_test
      MIGRATION_EXPECTED_HOST: 127.0.0.1
      MIGRATION_REQUIRE_TARGET_GUARDS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration journal
        run: pnpm db:migrations:check
      - name: Exercise webhook backfill with legacy duplicates
        run: pnpm db:migrate:test-webhook
      - name: Exercise geometry-state backfill with legacy rows
        run: pnpm db:migrate:test-geometry-state
      - name: Exercise stream lifecycle upgrade with existing raw payloads
        run: pnpm db:migrate:test-stream-lifecycle
      - name: Apply all migrations to empty Postgres
        run: pnpm db:migrate
      - name: Verify current migration state
        run: pnpm db:migrate:check
      - name: Prove revoked-athlete erasure against Postgres
        run: pnpm db:test-erasure
      - name: Prove revoked accounts are excluded from legacy activity sync
        run: pnpm db:test-legacy-sync-selection
      - name: Prove resumable Strava summary reconciliation against Postgres
        run: pnpm db:test-summary-reconciliation
      - name: Prove raw activity streams and stale-write guards against Postgres
        run: pnpm db:test-activity-streams
      - name: Prove stream API, invalidation and shared request budgeting
        run: pnpm db:test-stream-lifecycle
      - name: Prove photo catch-up preserves existing data
        run: pnpm db:test-photo-backfill
      - name: Prove conservative hourly stream backfill
        run: pnpm db:test-stream-backfill
      - name: Prove ingestion eligibility, outcomes and account-scoped status
        run: pnpm db:test-ingestion-status
      - name: Prove manual Strava import leases, checkpoints and account isolation
        run: pnpm db:test-strava-import
      - name: Prove a second migration run is a no-op
        run: pnpm db:migrate
      - name: Verify schema fingerprint
        run: pnpm db:schema:fingerprint
      - name: Verify schema changes have a generated migration
        run: |
          pnpm db:generate --name ci-drift-check
          git diff --exit-code -- drizzle
