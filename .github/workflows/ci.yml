name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.native.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changes affecting native checks
        id: native
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          native=true
          if [[ -n "$CHANGE_BASE" && ! "$CHANGE_BASE" =~ ^0+$ ]] &&
             git cat-file -e "$CHANGE_BASE^{commit}" &&
             git diff --name-only -z --no-renames "$CHANGE_BASE" HEAD > "$RUNNER_TEMP/native-changed-paths"; then
            native=false
            while IFS= read -r -d '' path; do
              case "$path" in
                ios/*|shared/*|src/contracts/*|openapi/*|src/lib/streams/*|src/server/strava/stream*)
                  native=true; break ;;
                scripts/quality/native-harness.mjs|scripts/quality/process.mjs|scripts/quality/harness.test.mjs)
                  native=true; break ;;
                scripts/*swift*|scripts/*ios*|scripts/*compact*|scripts/verify-stream-dtos.sh|scripts/proofs/*|scripts/fixtures/compact-stream-corpus.ts|scripts/testflight/*)
                  native=true; break ;;
                scripts/generate-api-dtos-swift.ts|scripts/generate-map-catalog-swift.ts|scripts/generate-stats-tiles.ts|scripts/generate-presentation.mjs)
                  native=true; break ;;
                .github/workflows/ci.yml|.github/workflows/ios-full.yml|.github/workflows/testflight.yml)
                  native=true; break ;;
              esac
            done < "$RUNNER_TEMP/native-changed-paths"
          fi
          echo "changed=$native" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check formatting of this change only
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check --base "$FORMAT_BASE"
      - name: Fetch main for the OpenAPI breaking-change comparison
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
      - name: Check for breaking OpenAPI changes vs main
        run: pnpm openapi:check-breaking -- --base=origin/main

  convex-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend check
      - run: pnpm exec tsx --conditions=react-server --tsconfig backend/convex/tsconfig.json --test backend/tests/sync.test.ts backend/tests/app-bridge.test.ts backend/tests/mirror.test.ts backend/tests/viewer.test.ts backend/tests/library.test.ts backend/tests/ingestion.test.ts backend/tests/commands.test.ts backend/tests/auth-store.test.ts

  browser-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision the pinned Chromium and Linux libraries
        run: pnpm test:browser:install --with-deps
      - name: Run fixture-only composed browser regressions
        run: pnpm test:browser
      - name: Verify selected-route place markers and elevation annotations
        run: pnpm test:activity-places-ui
      - name: Verify local place autocomplete, filters and details
        run: pnpm test:place-search-ui
      - name: Verify account-scoped place matching experiments
        run: pnpm test:place-debug-ui
      - name: Upload browser logs, traces, screenshots and result counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-${{ github.run_attempt }}
          path: output/quality/browser/
          if-no-files-found: warn
          retention-days: 7

  library-owner-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install lockfile-pinned Chromium
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Verify committed library updates, offline recovery and account cleanup
        run: pnpm test:library-owner
      - name: Preserve browser traces, requests and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-owner-browser
          path: output/library-owner/
          if-no-files-found: warn

  swift-client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate and compile the Swift client
        run: bash scripts/verify-swift-client.sh

  # Builds the real app and runs unit/app-hosted suites plus focused UI smoke
  # journeys on an owned simulator. The manual ios-full workflow runs the full
  # UI matrix. The api-dtos:check step in `quality` only compares generated text, and
  # `swift-client` above compiles a separate OpenAPI-generated package, so
  # this job additionally catches runtime failures and requires nonzero tests.
  #
  # The minimum deployment target is iOS 26. The iOS 27 SDK is still needed
  # to compile optional, availability-guarded APIs such as cross-fade navigation.
  # Keep the Xcode 27 runner for that SDK.
  ios-app:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: xcode-27
    concurrency:
      group: ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 42
    env:
      IOS_TEST_PROFILE: pr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record the toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator
          fingerprint=$( { xcodebuild -version; xcodebuild -showsdks; sw_vers -buildVersion; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore Swift packages and compiled simulator dependencies
        id: native-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            .quality/ios-derived/SourcePackages
            .quality/ios-derived/Build
            .quality/ios-derived/ModuleCache.noindex
            .quality/ios-derived/SDKStatCaches.noindex
            .quality/ios-derived/SDKExplicitPrecompiledModules
            .quality/ios-derived/CompilationCache.noindex
          key: ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/*.pbxproj', 'ios/**/*.xcscheme', 'ios/**/Config/*.xcconfig', 'scripts/quality/native-harness.mjs') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/*.pbxproj', 'ios/**/*.xcscheme', 'ios/**/Config/*.xcconfig', 'scripts/quality/native-harness.mjs') }}-
      - name: Verify old and new Swift clients decode stream metadata
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
          bash scripts/verify-stream-dtos.sh origin/main
      - name: Verify compact summary codecs and encoded cache round trips
        run: bash scripts/verify-compact-stream-codec.sh
      - name: Run iOS unit and UI smoke regressions on an owned simulator
        id: native
        run: node scripts/quality/native-harness.mjs
      - name: Save successful build even when runtime tests fail
        if: ${{ !cancelled() && steps.native.outputs.build_succeeded == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            .quality/ios-derived/SourcePackages
            .quality/ios-derived/Build
            .quality/ios-derived/ModuleCache.noindex
            .quality/ios-derived/SDKStatCaches.noindex
            .quality/ios-derived/SDKExplicitPrecompiledModules
            .quality/ios-derived/CompilationCache.noindex
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload native result bundle and test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-runtime-${{ github.run_attempt }}
          path: output/quality/ios/
          if-no-files-found: warn
          retention-days: 7
