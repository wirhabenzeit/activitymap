name: Full iOS runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-full:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      IOS_TEST_PROFILE: full
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record the toolchain
        id: toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator
          fingerprint=$( { xcodebuild -version; xcodebuild -showsdks; sw_vers -buildVersion; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore Swift packages and compiled simulator dependencies
        id: native-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            .quality/ios-derived/SourcePackages
            .quality/ios-derived/Build
            .quality/ios-derived/ModuleCache.noindex
            .quality/ios-derived/SDKStatCaches.noindex
            .quality/ios-derived/SDKExplicitPrecompiledModules
            .quality/ios-derived/CompilationCache.noindex
          key: ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/*.pbxproj', 'ios/**/*.xcscheme', 'ios/**/Config/*.xcconfig', 'scripts/quality/native-harness.mjs') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('ios/**/Package.resolved', 'ios/**/*.pbxproj', 'ios/**/*.xcscheme', 'ios/**/Config/*.xcconfig', 'scripts/quality/native-harness.mjs') }}-
      - name: Verify old and new Swift clients decode stream metadata
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --depth=1
          bash scripts/verify-stream-dtos.sh origin/main
      - name: Verify compact summary codecs and encoded cache round trips
        run: bash scripts/verify-compact-stream-codec.sh
      - name: Run full iOS runtime regressions on an owned simulator
        id: native
        run: node scripts/quality/native-harness.mjs
      - name: Save successful build even when runtime tests fail
        if: ${{ !cancelled() && steps.native.outputs.build_succeeded == 'true' && steps.native-cache.outputs.cache-hit != 'true' && steps.native-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            .quality/ios-derived/SourcePackages
            .quality/ios-derived/Build
            .quality/ios-derived/ModuleCache.noindex
            .quality/ios-derived/SDKStatCaches.noindex
            .quality/ios-derived/SDKExplicitPrecompiledModules
            .quality/ios-derived/CompilationCache.noindex
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload native result bundle and test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-full-runtime-${{ github.run_attempt }}
          path: output/quality/ios/
          if-no-files-found: warn
          retention-days: 7
