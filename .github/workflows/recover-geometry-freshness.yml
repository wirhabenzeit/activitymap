name: Recover geometry freshness

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit candidates or apply the exact-match recovery
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
      confirmation:
        description: For apply, enter RECOVER_2026_09_20_GEOMETRY
        required: false
        type: string

permissions:
  contents: read

jobs:
  recovery:
    name: ${{ inputs.operation }} geometry recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: Production
    env:
      CI: 'true'
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_EXPECTED_HOST: ${{ vars.MIGRATION_EXPECTED_HOST }}
      MIGRATION_EXPECTED_DATABASE: ${{ vars.MIGRATION_EXPECTED_DATABASE }}
      MIGRATION_EXPECTED_BRANCH_ID: ${{ vars.MIGRATION_EXPECTED_BRANCH_ID }}
      MIGRATION_REQUIRE_TARGET_GUARDS: 'true'
      RECOVERY_SOURCE_DATABASE_URL: ${{ secrets.RECOVERY_SOURCE_DATABASE_URL }}
      RECOVERY_SOURCE_EXPECTED_HOST: ${{ vars.RECOVERY_SOURCE_EXPECTED_HOST }}
      RECOVERY_SOURCE_EXPECTED_DATABASE: ${{ vars.RECOVERY_SOURCE_EXPECTED_DATABASE }}
      RECOVERY_SOURCE_EXPECTED_BRANCH_ID: ${{ vars.RECOVERY_SOURCE_EXPECTED_BRANCH_ID }}
      RECOVERY_MODE: ${{ inputs.operation }}
      RECOVERY_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run guarded recovery
        run: pnpm db:recover:geometry
