<style>
#outdoor-trail-comparison { color:var(--foreground); font-family:var(--font-sans); }
#outdoor-trail-comparison .labels { display:flex; justify-content:space-between; gap:16px; margin-bottom:8px; }
#outdoor-trail-comparison .camera { color:var(--muted-foreground); margin-bottom:12px; }
#outdoor-trail-comparison .maps { position:relative; aspect-ratio:628/704; overflow:hidden; }
#outdoor-trail-comparison img { display:block; width:100%; height:100%; object-fit:contain; }
#outdoor-trail-comparison .original { position:absolute; inset:0; clip-path:inset(0 50% 0 0); }
#outdoor-trail-comparison .divider { position:absolute; top:0; bottom:0; left:50%; border-left:2px solid var(--foreground); pointer-events:none; }
#outdoor-trail-comparison .scrub { display:flex; align-items:center; gap:12px; margin-top:12px; }
#outdoor-trail-comparison input { flex:1; min-width:60px; }
#outdoor-trail-comparison .credits { margin-top:12px; }
#outdoor-trail-comparison a { color:var(--primary); }
</style>
<div id="outdoor-trail-comparison">
  <div class="labels"><span>Original Outdoor</span><span>Dimmed hiking trails</span></div>
  <div class="camera">Interlaken · zoom 11 · same terrain and contours</div>
  <div class="maps" role="img" aria-label="MapTiler Outdoor around Interlaken. Original hiking trails on the left of the divider; muted and thinner hiking trails on the right.">
    <img src="outdoor-trails-dimmed.jpg" alt="Outdoor map with quieter hiking trails">
    <img class="original" src="outdoor-trails-original.jpg" alt="Original Outdoor map with brightly coloured hiking trails">
    <div class="divider"></div>
  </div>
  <div class="scrub">
    <span>Original</span>
    <input class="form-range" type="range" min="0" max="100" value="50" aria-label="Reveal original hiking trail styling" aria-valuetext="50 percent original, 50 percent dimmed">
    <span>Dimmed</span>
  </div>
  <div class="credits text-small"><a href="https://www.maptiler.com/copyright/">© MapTiler</a> · <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></div>
</div>
<script>
(() => {
  const root = document.getElementById('outdoor-trail-comparison');
  const slider = root.querySelector('input');
  const update = () => {
    root.querySelector('.original').style.clipPath = `inset(0 ${100 - Number(slider.value)}% 0 0)`;
    root.querySelector('.divider').style.left = `${slider.value}%`;
    slider.setAttribute('aria-valuetext', `${slider.value} percent original, ${100 - Number(slider.value)} percent dimmed`);
  };
  slider.addEventListener('input', update);
  update();
})();
</script>
