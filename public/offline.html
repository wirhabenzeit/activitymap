<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ActivityMap Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #f5f5f5;
        color: #111827;
      }
      main {
        max-width: 32rem;
        padding: 1.5rem;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      p {
        line-height: 1.5;
      }
      a {
        color: #0f62fe;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #f3f4f6;
        }
        main {
          background: #111827;
          border-color: #1f2937;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        ActivityMap could not reach the network. If you already opened the app
        online before, try <a href="/map">/map</a> or <a href="/list">/list</a>.
      </p>
      <p>
        Once the connection is back, refresh to sync the newest activities.
      </p>
    </main>
  </body>
</html>
