# Standalone stack: docker compose -f docker-compose.places.yml up --build -d
# The project name isolates this stack's volume and network from docker-compose.yml.
name: activitymap-places-poc

services:
  places-postgres:
    build:
      context: ./docker/postgres-places
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: activitymap_places_test
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - places_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d activitymap_places_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  places_db_data:
